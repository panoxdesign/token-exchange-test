name: Test
variables:
  - name: FE_URL
    value: http://localhost:8080
    description: Frontend-Keycloak
  - name: BE_URL
    value: http://localhost:8181
    description: Backend-Keycloak
  - name: FE_REALM
    value: frontend
    description: ""
  - name: BE_REALM
    value: Backend-Microservices
    description: ""
  - name: BACKEND_ISSUER
    value: http://localhost:8181/realms/Backend-Microservices
    description: Issuer des Backends - audience beim Exchange, aud der Assertion
  - name: ACCESS_SCOPE
    value: access-backend
    description: Optionaler Scope im Frontend, traegt RTM- und Selfservice-Exchange-Gate-Mapper (setzt die Backend-aud nur bei selfservice im aktiven Mandanten)
  - name: BE_REQUESTER_CLIENT
    value: backend-requester
    description: Backend-Client, loest die Assertion per jwt-bearer ein (baut token3)
  - name: SVC_ERECHNUNG
    value: e-rechnung
    description: ""
  - name: SVC_FAHRTKOSTEN
    value: fahrtkostenerstattung
    description: ""
  - name: SERVICE_SCOPE_ERECHNUNG
    value: "service:e-rechnung"
    description: Buchungs-Marker-Scope im Frontend - landet unveraendert im scope-Claim von token2
  - name: SERVICE_SCOPE_FAHRTKOSTEN
    value: "service:fahrtkostenerstattung"
    description: Buchungs-Marker-Scope im Frontend - landet unveraendert im scope-Claim von token2
  - name: GATEWAY_CLIENT
    value: gateway
    description: Requester-Client des internen UND externen Exchange im Frontend-Realm
  - name: SP_CLIENT
    value: self-service-portal
    description: Client fuer den Passwort-Grant des Lab-Users
  - name: LAB_USER
    value: lab-user
    description: Traegt admin+selfservice auf domain-5678, nur admin auf domain-1234
  - name: LAB_PASS
    value: lab-user
    description: ""
  - name: DOMAIN_5678
    value: domain-5678
    description: Ziel-Domain fuer den internen Exchange, Rollen admin/selfservice
  - name: DOMAIN_1234
    value: domain-1234
    description: Ziel-Domain fuer den internen Exchange, Rollen admin/selfservice (lab-user hat hier nur admin)
  - name: BE_REQUESTER_SECRET
    value: lab-backend-requester-secret
    description: Secret von backend-requester im Backend-Realm
  - name: GATEWAY_SECRET
    value: lab-frontend-gateway-secret
    description: Secret des Gateway-Clients im Frontend-Realm
  - name: SP_SECRET
    value: lab-frontend-sp-secret
    description: Secret des self-service-portal-Clients im Frontend-Realm
