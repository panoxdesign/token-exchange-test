info:
  name: 02 Token Exchange (Assertion)
  type: http
  seq: 2

http:
  method: POST
  url: "{{FE_URL}}/realms/{{FE_REALM}}/protocol/openid-connect/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: urn:ietf:params:oauth:grant-type:token-exchange
      - name: subject_token_type
        value: urn:ietf:params:oauth:token-type:access_token
      - name: subject_token
        value: "{{token1}}"
      - name: scope
        value: "{{ACCESS_SCOPE}} {{SERVICE_SCOPE_ERECHNUNG}}"
      - name: audience
        value: "{{BACKEND_ISSUER}}"
      - name: client_id
        value: "{{GATEWAY_CLIENT}}"
      - name: client_secret
        value: "{{GATEWAY_SECRET}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token2", res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |
  Schritt 2. Standard Token Exchange V2 im Frontend-Realm.

  Drei Parameter machen die Arbeit:
    scope=access-backend        aktiviert den optionalen Client Scope und damit
                                 den Audience-Mapper. Ohne ihn bekommt das
                                 Ergebnis kein aud und Request 03 scheitert.
    scope=service:e-rechnung    Buchungs-Marker: das Frontend/BFF wuerde diesen
                                 Scope anhand der CSV (docs/buchungen.csv)
                                 waehlen. Landet unveraendert im scope-Claim von
                                 token2 - der Booking-Restriction-Mapper im
                                 Backend liest ihn dort wieder aus.
    audience=<Backend>          grenzt die Audiences auf das Backend ein
                                 (Downscoping).

  Erlaubt ist der Exchange, weil gateway der azp von token1 ist - es tauscht
  ein Token, das es selbst (in Request 05a) erhalten hat. Bei einem fremden
  Token muesste der anfragende Client im aud des subject_token stehen.

  Erwartung:
    aud    http://localhost:8181/realms/Backend-Microservices
    scope  access-backend service:e-rechnung profile email
    jti    gesetzt - jede Assertion gilt genau einmal

  Das Ergebnis ist KEIN Bearer-Token, sondern eine Assertion mit genau einem
  Zweck: Request 03. Fuer jeden Einloeseversuch wird eine neue gebraucht.

  Fuer Request 03b (fahrtkostenerstattung) diesen Request vorher mit
  scope="access-backend {{SERVICE_SCOPE_FAHRTKOSTEN}}" erneut ausfuehren - sonst
  bucht token2 nur e-rechnung und 03b liefert (korrekt) ein leeres
  resource_access, siehe Request 03c.
