info:
  name: 02 Token Exchange (Assertion)
  type: http
  seq: 2

docs: |
  Schritt 2. Standard Token Exchange V2 im Frontend-Realm.

  Zwei Parameter machen die Arbeit:
    scope=access-backend   aktiviert den optionalen Client Scope und damit den
                           Audience-Mapper. Ohne ihn bekommt das Ergebnis kein
                           aud und Request 03 scheitert.
    audience=<Backend>     grenzt die Audiences auf das Backend ein (Downscoping).

  Erlaubt ist der Exchange, weil domain-5678 sein EIGENES Token tauscht. Bei
  einem fremden Token muesste der anfragende Client im aud des subject_token
  stehen.

  Erwartung:
    aud    http://localhost:8081/realms/Backend-Microservices
    scope  access-backend profile email
    jti    gesetzt - jede Assertion gilt genau einmal

  Das Ergebnis ist KEIN Bearer-Token, sondern eine Assertion mit genau einem
  Zweck: Request 03. Fuer jeden Einloeseversuch wird eine neue gebraucht.

http:
  method: POST
  url: "{{FE_URL}}/realms/{{FE_REALM}}/protocol/openid-connect/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: "urn:ietf:params:oauth:grant-type:token-exchange"
      - name: subject_token_type
        value: "urn:ietf:params:oauth:token-type:access_token"
      - name: subject_token
        value: "{{token1}}"
      - name: scope
        value: "{{ACCESS_SCOPE}}"
      - name: audience
        value: "{{BACKEND_ISSUER}}"
      - name: client_id
        value: "{{DOMAIN_CLIENT}}"
      - name: client_secret
        value: "{{FE_DOMAIN_SECRET}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        bru.setVar("token2", res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
